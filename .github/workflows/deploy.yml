name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Native ARM64 runner so the image builds without QEMU emulation (Node's
    # npm ci crashes with "illegal instruction" under emulated arm64).
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create production Dockerfile
        run: |
          cat > Dockerfile.deploy <<'EOF'
          FROM node:20-alpine AS deps
          WORKDIR /app
          COPY package*.json ./
          RUN npm ci

          FROM node:20-alpine AS builder
          WORKDIR /app
          COPY --from=deps /app/node_modules ./node_modules
          COPY . .
          RUN npm run build

          FROM node:20-alpine AS runner
          WORKDIR /app
          ENV NODE_ENV=production
          ENV PORT=3005
          COPY package*.json ./
          RUN npm ci --omit=dev
          COPY --from=builder /app/public ./public
          COPY --from=builder /app/.next ./.next
          EXPOSE 3005
          CMD ["npm", "run", "start"]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ARM64 image and export
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag sahc-web:latest \
            --output type=docker,dest=sahc-web.tar \
            -f Dockerfile.deploy \
            .

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Transfer image to server
        run: |
          scp sahc-web.tar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/sahc-web.tar

      - name: Deploy on server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            docker load -i /tmp/sahc-web.tar
            docker stop sahc-web || true
            docker rm sahc-web || true
            docker run -d \
              --name sahc-web \
              --network waglogy-net \
              --restart unless-stopped \
              -p 3005:3005 \
              sahc-web:latest
            rm /tmp/sahc-web.tar
          EOF
